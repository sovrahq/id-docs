server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;

    # Cloud Run termina TLS adelante: las redirecciones (p. ej. /conceptos → /conceptos/)
    # tienen que ser relativas para no bajar a http.
    absolute_redirect off;
    server_tokens off;

    # Headers de seguridad. Un add_header dentro de un location reemplaza a todos los
    # del server, así que se repiten en /_astro/.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown application/xml;

    # Las páginas tienen versión Markdown (/ruta/index.md) y llms.txt para agentes.
    types {
        text/markdown md mdx;
    }
    include /etc/nginx/mime.types;
    charset utf-8;
    charset_types text/html text/plain text/css text/markdown application/javascript application/json image/svg+xml application/xml;
    index index.html;

    location / {
        # /conceptos → /conceptos/ (redirección), /conceptos/ → index.html.
        try_files $uri $uri/ =404;
    }

    # Archivos con hash: no cambian nunca (igual que public/_headers para Cloudflare).
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

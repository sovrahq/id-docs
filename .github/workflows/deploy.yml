name: Deploy docs

# Construye la imagen del sitio y la despliega en Cloud Run.
# Configuración de un solo uso: infra/gcp/setup.sh (ver infra/gcp/README.md).

on:
  push:
    branches: [main]
    paths:
      - apps/docs/**
      - packages/**
      - infra/gcp/**
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - turbo.json
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: false

env:
  SERVICE: sovra-id-docs
  AR_REPO: docs

permissions:
  contents: read

jobs:
  # Lo mismo que el CI: no se despliega algo que no pasa lint ni typecheck.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      # El lint lee las reglas de .nimbus/lint.json, que escribe el build.
      - run: npm run build
      - run: npm run lint:docs
      - run: npm run typecheck

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write # para la federación de identidad con Google Cloud
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Build y push de la imagen
        id: image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/$AR_REPO/$SERVICE:${{ github.sha }}"
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build --build-arg SITE_URL="${{ vars.SITE_URL }}" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy a Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ steps.image.outputs.image }}
          flags: >-
            --service-account=${{ vars.GCP_RUNTIME_SA }}
            --allow-unauthenticated
            --port=8080
            --cpu=1
            --memory=256Mi
            --min-instances=0
            --max-instances=3
            --concurrency=200

      - name: Smoke test
        run: |
          for path in / /conceptos/ /api/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.deploy.outputs.url }}$path")
            echo "$code $path"
            test "$code" = 200
          done
          echo "Desplegado en ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
